apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: quickkart
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: prod
  template:
    metadata:
      name: 'quickkart-{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/__GITHUB_USER__/argocd-jenkins-lab.git
        targetRevision: main
        path: 'gitops/envs/{{.env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'quickkart-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
